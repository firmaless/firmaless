name: 🐞 Bug report
description: Something in FirmaLess doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        > [!CAUTION]
        > **This page is public.** Never attach a real document, a signature, or a screenshot that shows either. If one particular PDF fails, describe it; we will arrange a private way to receive the file if we need it.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The shortest list of steps that shows the problem.
      placeholder: |
        1. Open a PDF
        2. Add a signature from a photo
        3. …
    validations:
      required: true
  - type: dropdown
    id: step
    attributes:
      label: Where in the app?
      options:
        - Opening a PDF
        - Getting my signature from a photo or scan
        - Placing, resizing or turning the signature
        - Preview
        - Download of the result
        - Saved signatures
        - The website (not the app itself)
        - Something else
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 141, Firefox 144, Safari 26…
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 26, Ubuntu 26.04…
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Language of the app
      options:
        - English
        - Italiano
    validations:
      required: true
  - type: input
    id: scan-settings
    attributes:
      label: Scan settings, if the problem is in the result
      description: The choices under "Scan look" when you exported (color or grayscale, quality).
      placeholder: Grayscale, standard quality
  - type: textarea
    id: pdf
    attributes:
      label: About the PDF, if one particular file fails
      description: Describe it, don't attach it. Where it came from, how many pages, password or not, roughly how large.
      placeholder: Made by my bank's website, 12 pages, no password, 3 MB
  - type: textarea
    id: message
    attributes:
      label: Message shown by the app, if any
      description: Copy the text. Remove the file name if it appears in it.
  - type: checkboxes
    id: public
    attributes:
      label: Before you send
      options:
        - label: Nothing I wrote or attached shows a real document, a signature or personal data.
          required: true
        - label: I searched the existing issues and did not find this one.
          required: true
